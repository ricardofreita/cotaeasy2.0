<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cotaeasy — compare cotações e ache o melhor preço</title>
  <meta name="description" content="Cotaeasy: envie seus itens para vários fornecedores, receba os preços e veja na hora quem tem o melhor valor de cada item.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='40' y2='40' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='12' fill='url(%23g)'/%3E%3Cpath d='M11 21.5l6 6 12-14' fill='none' stroke='white' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   Cotaeasy — azul + roxo, responsivo (celular, tablet, PC)
   ========================================================= */
:root {
  --blue: #2563eb;
  --indigo: #4f46e5;
  --violet: #7c3aed;
  --grad: linear-gradient(135deg, #2563eb 0%, #5b4ff0 50%, #8b3cf0 100%);
  --grad-soft: linear-gradient(135deg, rgba(37,99,235,.10), rgba(124,58,237,.13));

  --bg: #f3f4fd;
  --surface: #ffffff;
  --surface-2: #f7f7fe;
  --line: #e3e5f6;
  --line-2: #d0d3ee;
  --text: #14163a;
  --muted: #666b93;
  --primary: #4f46e5;

  --good: #0d8a5f;
  --good-bg: #e0f7ec;
  --good-line: #98dfc1;
  --warn: #a86500;
  --warn-bg: #fff3d9;
  --bad: #cf3a5a;
  --bad-bg: #ffe6ec;

  --shadow: 0 1px 2px rgba(20,22,58,.05), 0 10px 30px -14px rgba(70,55,190,.28);
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Sora', 'Manrope', system-ui, sans-serif;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0b0c20;
  --surface: #14163a;
  --surface-2: #1a1d48;
  --line: #272b5c;
  --line-2: #383c78;
  --text: #eef0ff;
  --muted: #9ba0d0;
  --primary: #8f90ff;
  --good: #4fdca4;
  --good-bg: rgba(45,212,150,.13);
  --good-line: rgba(45,212,150,.42);
  --warn: #ffc164;
  --warn-bg: rgba(255,193,100,.12);
  --bad: #ff7b96;
  --bad-bg: rgba(255,107,140,.13);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -16px rgba(0,0,0,.65);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 500 15px/1.5 var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
body.modal-open { overflow: hidden; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.02em; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(22px, 3.2vw, 30px); font-weight: 700; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
a { color: var(--primary); }
small { font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); }
.ic { flex: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 55%, transparent); outline-offset: 2px; border-radius: 8px; }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.main { min-width: 0; }
.content { padding: 30px 34px 90px; max-width: 1320px; margin: 0 auto; }

.sidebar {
  position: sticky; top: 0; height: 100vh; padding: 22px 16px 18px;
  display: flex; flex-direction: column; gap: 22px; color: #e8e9ff;
  background:
    radial-gradient(420px 260px at 0% 0%, rgba(59,130,246,.35), transparent 70%),
    radial-gradient(380px 300px at 100% 100%, rgba(168,85,247,.38), transparent 70%),
    linear-gradient(180deg, #14174a 0%, #231a72 55%, #34208a 100%);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; font: 800 21px/1 var(--display); letter-spacing: -.03em; color: #fff; text-decoration: none; }
.side-cta { width: 100%; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px;
  color: #c9cbff; text-decoration: none; font-weight: 600; transition: background .15s, color .15s;
}
.nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav a.active { background: rgba(255,255,255,.14); color: #fff; box-shadow: inset 3px 0 0 #a5b4fc; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.side-btn { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #dcdcff; font: 600 14px var(--font); cursor: pointer; text-align: left; }
.side-btn:hover { background: rgba(255,255,255,.12); }

.topbar { display: none; }
.bottom-nav { display: none; }

/* Tablet: barra lateral compacta */
@media (max-width: 1099px) {
  .layout { grid-template-columns: 78px minmax(0, 1fr); }
  .sidebar { padding: 20px 10px; align-items: center; }
  .sidebar .lbl { display: none; }
  .brand { padding: 0; }
  .nav a, .side-btn { justify-content: center; padding: 12px; }
  .side-cta { padding: 0; width: 46px; min-height: 46px; }
  .content { padding: 26px 24px 90px; }
}

/* Celular: barra inferior */
@media (max-width: 719px) {
  .layout { display: block; }
  .sidebar { display: none; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    position: sticky; top: 0; z-index: 30; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .brand { color: var(--text); font-size: 19px; padding: 0; }
  .content { padding: 20px 16px calc(104px + env(safe-area-inset-bottom)); }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 40;
    padding: 8px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 16px 40px -12px rgba(50,35,160,.45);
  }
  .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: 11px; font-weight: 700; color: var(--muted); text-decoration: none; border-radius: 14px; }
  .bottom-nav a.active { color: var(--primary); background: var(--grad-soft); }
  .bottom-nav .fab { width: 52px; height: 52px; margin: -22px auto 0; border-radius: 18px; background: var(--grad); color: #fff; padding: 0; justify-content: center; box-shadow: 0 10px 22px -6px rgba(91,79,240,.75); border: 3px solid var(--bg); }
  .bottom-nav .fab.active { background: var(--grad); color: #fff; }
}

/* ---------- Cabeçalho de página ---------- */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head .sub { color: var(--muted); margin-top: 6px; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13.5px; text-decoration: none; color: var(--muted); margin-bottom: 8px; }
.back:hover { color: var(--primary); }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; color: var(--muted); font-size: 13.5px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px;
  border-radius: 12px; border: 1px solid transparent; font: 700 14px/1 var(--font); cursor: pointer;
  text-decoration: none; white-space: nowrap; color: var(--text); background: transparent;
  transition: transform .15s, box-shadow .2s, background .15s, border-color .15s;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--grad); color: #fff; box-shadow: 0 10px 22px -10px rgba(91,79,240,.85); }
.btn.primary:hover { box-shadow: 0 12px 26px -10px rgba(91,79,240,1); }
.btn.soft { background: var(--surface-2); border-color: var(--line); }
.btn.soft:hover, .btn.ghost:hover { border-color: var(--line-2); background: var(--surface-2); }
.btn.ghost { border-color: var(--line-2); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: linear-gradient(135deg, #e0466a, #c3325f); box-shadow: 0 10px 22px -10px rgba(207,58,90,.8); }
.btn.wa { background: #e2f8ec; color: #0b7a3e; border-color: #b4e9ca; }
.btn.wa:hover { background: #d3f3e2; }
[data-theme="dark"] .btn.wa { background: rgba(37,211,102,.14); color: #62eaa4; border-color: rgba(37,211,102,.35); }
.btn.sm { min-height: 36px; padding: 0 13px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[aria-disabled="true"], .btn:disabled { opacity: .5; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.icon-btn:hover { color: var(--text); border-color: var(--line-2); }
.icon-btn.danger:hover { color: var(--bad); border-color: var(--bad); }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.card.flush { padding: 0; overflow: hidden; }
.card + .card, .card + .grid-2, .grid-2 + .card, .kpis + .card { margin-top: 18px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.card-head.pad { padding: 20px 22px 4px; margin-bottom: 8px; }
.card-head p { margin-top: 4px; font-size: 13.5px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 899px) { .grid-2 { grid-template-columns: 1fr; } }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
@media (max-width: 1099px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.kpi .tile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--grad-soft); color: var(--primary); flex: none; }
.kpi b { display: block; font: 700 22px/1.1 var(--display); letter-spacing: -.03em; }
.kpi small { display: block; margin-top: 3px; }
@media (max-width: 479px) { .kpi { padding: 14px; gap: 10px; } .kpi b { font-size: 18px; } .kpi .tile { width: 40px; height: 40px; } }

/* ---------- Chips, avatar, barras ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); border-color: var(--good-line); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.violet { background: var(--grad-soft); color: var(--primary); border-color: transparent; }
.avatar { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: #fff; font: 700 14px var(--display); flex: none; }
.avatar.sm { width: 32px; height: 32px; border-radius: 10px; font-size: 12px; }
.bar { height: 9px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--grad); transition: width .5s ease; }

.rank { display: grid; gap: 16px; }
.rank-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
.rank-row b { font-weight: 700; }
.rank-row .bar { margin-top: 7px; }
.rank-row .n { text-align: right; font: 700 15px var(--display); }
.rank-row .n small { display: block; font-family: var(--font); font-weight: 500; }

.list { display: grid; gap: 10px; }
.q-row { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--text); box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.q-row:hover { border-color: var(--primary); }
.q-row h3 { font-size: 16px; }
.q-row .meta { margin-top: 6px; }
.q-side { text-align: right; display: grid; gap: 6px; justify-items: end; }
.q-side b { font: 700 16px var(--display); }
.mini-row { display: block; padding: 14px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--text); }
.mini-row:first-child { border-top: 0; padding-top: 0; }
.mini-row .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 9px; font-weight: 700; }
@media (max-width: 599px) { .q-row { grid-template-columns: 1fr; } .q-side { text-align: left; justify-items: start; grid-auto-flow: column; justify-content: space-between; align-items: center; } }

/* ---------- Formulários ---------- */
.in, .field input, .field textarea, .field select, .setting input, .setting select {
  width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--text); font: 500 14.5px var(--font); transition: border-color .15s, box-shadow .15s;
}
.field textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.in:focus, .field input:focus, .field textarea:focus, .field select:focus, .setting input:focus, .setting select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 20%, transparent); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-weight: 700; font-size: 13.5px; }
.field small { margin-top: -2px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 519px) { .field-row { grid-template-columns: 1fr; } }
.search { position: relative; }
.search input { padding-left: 38px; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

.switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.switch span { width: 40px; height: 24px; border-radius: 99px; background: var(--line-2); position: relative; transition: background .2s; flex: none; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + span { background: var(--grad); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--primary) 55%, transparent); outline-offset: 2px; }

/* ---------- Abas ---------- */
.tabs { display: flex; gap: 6px; padding: 5px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 9px; padding: 10px 16px; border-radius: 12px; text-decoration: none; color: var(--muted); font-weight: 700; white-space: nowrap; flex: 1; justify-content: center; }
.tab .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--display); background: var(--surface-2); border: 1px solid var(--line); }
.tab:hover { color: var(--text); }
.tab.active { background: var(--grad); color: #fff; box-shadow: 0 8px 18px -10px rgba(91,79,240,.9); }
.tab.active .n { background: rgba(255,255,255,.22); border-color: transparent; color: #fff; }

/* ---------- Editor de itens ---------- */
.item-head, .item-row { display: grid; grid-template-columns: minmax(180px, 2.2fr) 90px 90px minmax(140px, 1.6fr) 40px; gap: 10px; align-items: center; }
.item-head { padding: 0 2px 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.item-row { padding: 6px 0; }
@media (max-width: 719px) {
  .item-head { display: none; }
  .item-row { grid-template-columns: 1fr 1fr 40px; padding: 14px 0; border-top: 1px solid var(--line); }
  .item-row .name { grid-column: 1 / -1; }
  .item-row .obs { grid-column: 1 / 3; }
}

/* ---------- Envio ---------- */
.send-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 16px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.send-row + .send-row { margin-top: 10px; }
.send-row.on { border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); }
.send-row .check { display: flex; align-items: center; gap: 12px; cursor: pointer; min-width: 0; }
.send-row .check input { width: 20px; height: 20px; accent-color: var(--violet); flex: none; }
.send-row .check b { display: block; }
.send-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
@media (max-width: 899px) { .send-row { grid-template-columns: 1fr; } .send-tools { justify-content: flex-start; } }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 4px; }
.step { padding: 16px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); }
.step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #fff; font: 700 13px var(--display); margin-bottom: 10px; }
.step b { display: block; margin-bottom: 4px; }
.step p { font-size: 13.5px; color: var(--muted); }
@media (max-width: 799px) { .steps { grid-template-columns: 1fr; } }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--warn-bg); color: var(--warn); font-size: 14px; font-weight: 600; margin-bottom: 18px; }
.notice.info { background: var(--grad-soft); color: var(--text); }
.notice .btn { margin-left: auto; }
@media (max-width: 599px) { .notice { flex-wrap: wrap; } .notice .btn { margin-left: 0; } }

/* ---------- Resumo do comparativo (destaque do sistema) ---------- */
.summary { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.sum-hero { position: relative; overflow: hidden; padding: 22px; border-radius: 20px; color: #fff; background: var(--grad); box-shadow: 0 18px 40px -18px rgba(91,79,240,.9); }
.sum-hero::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.28), transparent); }
.sum-hero small { color: rgba(255,255,255,.82); font-weight: 600; }
.sum-hero b { display: block; font: 800 clamp(26px, 3.4vw, 34px)/1.1 var(--display); letter-spacing: -.035em; margin: 8px 0 10px; }
.sum-hero .save { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px; line-height: 1.35; background: rgba(255,255,255,.2); font-size: 13px; font-weight: 700; }
.sum { padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.sum b { font: 700 19px/1.2 var(--display); letter-spacing: -.02em; }
.sum small { line-height: 1.4; }
@media (max-width: 1099px) { .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); } .sum-hero { grid-column: 1 / -1; } }
@media (max-width: 599px) { .summary { grid-template-columns: 1fr 1fr; } .sum:last-child { grid-column: 1 / -1; } }

/* ---------- Tabela comparativa ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.cmp { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 720px; }
.cmp th, .cmp td { padding: 12px 12px; text-align: left; vertical-align: middle; border-top: 1px solid var(--line); }
.cmp thead th { border-top: 0; background: var(--surface-2); font-size: 13px; position: sticky; top: 0; z-index: 2; }
.cmp .sticky-col { position: sticky; left: 0; z-index: 3; background: var(--surface); min-width: 190px; max-width: 240px; box-shadow: 1px 0 0 var(--line); }
.cmp thead .sticky-col { background: var(--surface-2); }
.cmp td.sticky-col b { display: block; line-height: 1.3; }
.sup-th { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.sup-th b { display: block; font-size: 14px; }
.sup-th small.ok { color: var(--good); font-weight: 700; }
.win-th { min-width: 150px; }
.price-cell { min-width: 150px; transition: background .2s; }

/* ---------- Compactação para links e códigos ---------- */
function bytesToB64u(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uToBytes(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const bin = atob(str), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function pack(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream !== 'undefined') {
    try {
      const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z' + bytesToB64u(new Uint8Array(await new Response(stream).arrayBuffer()));
    } catch (e) { /* cai para sem compressão */ }
  }
  return 'p' + bytesToB64u(raw);
}
async function unpack(code) {
  const kind = code[0], bytes = b64uToBytes(code.slice(1));
  let raw = bytes;
  if (kind === 'z') {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    raw = new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(raw));
}

/* ---------- Análise: quem tem o melhor preço ---------- */
function analyze(q) {
  const sups = q.suppliers.map(getSup).filter(Boolean);
  const res = q.responses || {};
  const price = (sid, iid) => { const v = res[sid]?.prices?.[iid]; return (typeof v === 'number' && v > 0) ? v : null; };

  const items = q.items.map(it => {
    const offers = sups.map(s => ({ sid: s.id, price: price(s.id, it.id) })).filter(o => o.price != null);
    let min = null, max = null, avg = null, winner = null;
    if (offers.length) {
      const ps = offers.map(o => o.price);
      min = Math.min(...ps); max = Math.max(...ps); avg = ps.reduce((a, b) => a + b, 0) / ps.length;
      const pinned = q.overrides?.[it.id];
      winner = (pinned && offers.some(o => o.sid === pinned)) ? pinned : offers.find(o => o.price === min).sid;
    }
    const wp = winner ? price(winner, it.id) : null;
    return {
      item: it, offers, min, max, avg, winner, winnerPrice: wp,
      total: wp != null ? wp * it.qty : 0,
      saving: (winner && offers.length > 1) ? Math.max(0, avg - wp) * it.qty : 0
    };
  });

  const useFrete = q.useFrete !== false;
  const bySup = {};
  sups.forEach(s => {
    let sub = 0, n = 0;
    q.items.forEach(it => { const p = price(s.id, it.id); if (p != null) { sub += p * it.qty; n++; } });
    bySup[s.id] = { sub, n, missing: q.items.length - n, frete: res[s.id]?.frete || 0, complete: q.items.length > 0 && n === q.items.length, responded: n > 0 };
  });

  const winners = new Set(items.filter(r => r.winner).map(r => r.winner));
  const splitItems = items.reduce((a, r) => a + r.total, 0);
  const splitFrete = useFrete ? [...winners].reduce((a, sid) => a + (bySup[sid]?.frete || 0), 0) : 0;
  const singles = sups.filter(s => bySup[s.id].complete).map(s => ({ sid: s.id, total: bySup[s.id].sub + (useFrete ? bySup[s.id].frete : 0) }));
  const bestSingle = singles.length ? singles.reduce((a, b) => b.total < a.total ? b : a) : null;

  return {
    sups, items, bySup, winners, useFrete, splitItems, splitFrete, split: splitItems + splitFrete, bestSingle,
    saving: items.reduce((a, r) => a + r.saving, 0),
    priced: items.filter(r => r.winner).length,
    responses: sups.filter(s => bySup[s.id].responded).length
  };
}
function globalStats() {
  const st = { open: 0, closed: 0, saving: 0, priced: 0, items: 0, wins: {}, offers: {} };
  state.suppliers.forEach(s => { st.wins[s.id] = 0; st.offers[s.id] = 0; });
  state.quotes.forEach(q => {
    q.status === 'fechada' ? st.closed++ : st.open++;
    const a = analyze(q);
    st.saving += a.saving; st.items += q.items.length; st.priced += a.priced;
    a.items.forEach(r => {
      if (r.winner) st.wins[r.winner] = (st.wins[r.winner] || 0) + 1;
      r.offers.forEach(o => { st.offers[o.sid] = (st.offers[o.sid] || 0) + 1; });
    });
  });
  return st;
}
function getResp(q, sid) {
  return (q.responses[sid] ||= { prices: {}, frete: 0, prazo: '', pgto: '', prazoPagamento: '', formasPagamento: [], pedidoMinimo: '', obs: '', at: Date.now() });
}

function orderFor(q, sid) {
  const a = analyze(q), s = getSup(sid);
  const rows = a.items.filter(r => r.winner === sid);
  const sub = rows.reduce((t, r) => t + r.total, 0);
  const frete = a.useFrete ? (a.bySup[sid]?.frete || 0) : 0;
  const r = q.responses[sid] || {};
  const msg = [
    `Olá${s.contact ? ', ' + s.contact : ''}! Quero fechar o pedido da cotação "${q.title}":`, '',
    ...rows.map(x => `• ${qtyFmt(x.item.qty)} ${x.item.unit} ${x.item.name} — ${money(x.winnerPrice)} un = ${money(x.total)}`),
    '', frete ? `Frete: ${money(frete)}` : '', `*Total: ${money(sub + frete)}*`,
    r.prazo ? `Prazo de entrega: ${r.prazo}` : '', r.prazoPagamento ? `Prazo de pagamento: ${r.prazoPagamento}` : '',
    (r.formasPagamento || []).length ? `Forma de pagamento: ${r.formasPagamento.join(', ')}` : '',
    '', 'Pode confirmar? Obrigado!'
  ].filter((l, i, arr) => l !== '' || (arr[i - 1] !== '' && i !== arr.length - 1)).join('\n');
  return { s, rows, sub, frete, total: sub + frete, msg };
}

function summaryHTML(q, a) {
  const winnersN = a.winners.size;
  const bs = a.bestSingle, bsName = bs ? getSup(bs.sid)?.name : '';
  const diff = bs ? bs.total - a.split : 0;
  return `<div class="summary">
    <div class="sum-hero"><small>Melhor combinação</small><b>${a.priced ? money(a.split) : '—'}</b>
      ${a.priced ? `<span class="save">${icon('trophy', 14)} ${diff > 0.005 ? `Economiza ${money(diff)} vs. comprar tudo da ${esc(bsName)}` : `${a.priced} ${a.priced === 1 ? 'item' : 'itens'} em ${winnersN} ${winnersN === 1 ? 'fornecedor' : 'fornecedores'}`}</span>` : '<span class="save">Aguardando preços</span>'}</div>
    <div class="sum"><small>Melhor fornecedor único</small><b>${bs ? esc(bsName) : '—'}</b><small>${bs ? money(bs.total) + ' pela lista completa' : 'Nenhum cotou todos os itens'}</small></div>
    <div class="sum"><small>Economia vs. média</small><b>${money(a.saving)}</b><small>Diferença entre o preço escolhido e a média das propostas</small></div>
    <div class="sum"><small>Itens com preço</small><b>${a.priced} de ${q.items.length}</b><small>${a.responses} de ${a.sups.length} fornecedores responderam</small></div></div>`;
}

          <tr><th class="sticky-col">Prazo de entrega</th>${a.sups.map(s => `<td><input data-meta="prazo" data-sup="${s.id}" value="${esc(r(s.id).prazo || '')}" placeholder="ex.: 2 dias" aria-label="Prazo ${esc(s.name)}"></td>`).join('')}<td></td></tr>

/* Atualiza o comparativo sem redesenhar (mantém o foco nos campos) */
function updateCompare() {
  const wrap = $('#compare'); if (!wrap) return;
  const q = getQuote(wrap.dataset.quote); if (!q) return;
  const a = analyze(q);
  const set = (sel, html) => { const el = wrap.querySelector(sel); if (el) el.innerHTML = html; };
  $('#summary', wrap).innerHTML = summaryHTML(q, a);

  a.items.forEach(r => {
    a.sups.forEach(s => {
      const td = wrap.querySelector(`[data-cell="${r.item.id}:${s.id}"]`); if (!td) return;
      const p = r.offers.find(o => o.sid === s.id)?.price ?? null;
      td.classList.toggle('is-winner', r.winner === s.id);
      td.classList.toggle('is-best', p != null && p === r.min && r.winner !== s.id);
      td.classList.toggle('is-pinned', r.winner === s.id && q.overrides?.[r.item.id] === s.id);
      const info = td.querySelector('.cell-info');
      if (p == null) info.innerHTML = '';
      else {
        const pct = Math.round((p / r.min - 1) * 100);
        info.innerHTML = `<span>${money(p * r.item.qty)}</span>` + (pct > 0 ? `<em class="delta up">+${pct}%</em>` : (r.offers.length > 1 && p === r.min ? '<em class="delta best">menor</em>' : ''));
      }
    });
    const w = r.winner ? getSup(r.winner) : null;
    set(`[data-win="${r.item.id}"]`, w ? `<b>${esc(w.name)}</b><small>${money(r.winnerPrice)} un · ${money(r.total)}</small>` : '<small>Sem preços</small>');
  });
  a.sups.forEach(s => {
    const b = a.bySup[s.id];
    set(`[data-status="${s.id}"]`, b.responded ? `${b.n}/${q.items.length} preços` : 'Aguardando');
    const st = wrap.querySelector(`[data-status="${s.id}"]`); if (st) st.classList.toggle('ok', b.responded);
    set(`[data-foot="sub:${s.id}"]`, `${money(b.sub)}${b.missing && b.n ? `<span class="warn-txt">${b.missing} sem preço</span>` : ''}`);
    const tot = wrap.querySelector(`[data-foot="total:${s.id}"]`);
    if (tot) { tot.textContent = b.n ? money(b.sub + (a.useFrete ? b.frete : 0)) : '—'; tot.classList.toggle('is-lowest', !!a.bestSingle && a.bestSingle.sid === s.id); }
  });
  set('[data-foot="split-sub"]', a.priced ? `<span style="color:var(--good)">${money(a.splitItems)}</span>` : '');
  set('[data-foot="split-frete"]', a.priced && a.useFrete ? `<span style="color:var(--good)">${money(a.splitFrete)}</span>` : '');
  set('[data-foot="split-total"]', a.priced ? `<span style="color:var(--good)">${money(a.split)}</span>` : '');
}

function parseMinOrder(txt) {
  if (!txt) return null;
  const m = String(txt).match(/[\d.,]+/);
  if (!m) return null;
  const n = parseNum(m[0]);
  return (typeof n === 'number' && n > 0) ? n : null;
}
function tabOrders(q, a) {
  const groups = a.sups.map(s => orderFor(q, s.id)).filter(g => g.rows.length);
  if (!groups.length) return emptyState('Ainda não há pedidos', 'Quando houver preços no comparativo, os pedidos aparecem aqui já separados por fornecedor.', `<a class="btn primary" href="#/cotacao/${q.id}/comparativo">Ir para o comparativo</a>`, 'trophy');
  return `<div class="notice info">${icon('info', 20)}<span>Cada item vai para o fornecedor com o melhor preço. Ajuste as escolhas no comparativo, se precisar.</span></div>
  ${groups.map(g => {
    const r = q.responses[g.s.id] || {};
    const minVal = parseMinOrder(r.pedidoMinimo);
    const belowMin = minVal != null && g.total < minVal;
    const conds = [r.pedidoMinimo ? `Pedido mínimo: ${esc(r.pedidoMinimo)}` : '', r.prazoPagamento ? `Prazo de pagamento: ${esc(r.prazoPagamento)}` : '', (r.formasPagamento || []).length ? `Pagamento: ${esc(r.formasPagamento.join(', '))}` : ''].filter(Boolean);
    return `<section class="card order">
    <div class="order-head"><span class="avatar" style="${avatarStyle(g.s.name)}">${initials(g.s.name)}</span><div class="grow"><h2>${esc(g.s.name)}</h2><small>${g.rows.length} ${g.rows.length === 1 ? 'item' : 'itens'} com o melhor preço</small></div><b style="font:700 20px var(--display)">${money(g.total)}</b></div>
    ${conds.length ? `<div class="chips" style="margin-bottom:12px">${conds.map(c => `<span class="chip">${c}</span>`).join('')}</div>` : ''}
    ${belowMin ? `<div class="notice" style="margin-bottom:12px">${icon('info', 18)}<span>Este pedido (${money(g.total)}) está abaixo do pedido mínimo do fornecedor (${money(minVal)}). Combine mais itens com ele ou ajuste as escolhas no comparativo.</span></div>` : ''}
    <div class="table-wrap"><table><thead><tr><th>Item</th><th class="r">Qtd.</th><th class="r">Preço un.</th><th class="r">Total</th></tr></thead>
      <tbody>${g.rows.map(x => `<tr><td>${esc(x.item.name)}</td><td class="r">${qtyFmt(x.item.qty)} ${esc(x.item.unit)}</td><td class="r">${money(x.winnerPrice)}</td><td class="r">${money(x.total)}</td></tr>`).join('')}</tbody>
      <tfoot>${g.frete ? `<tr><td colspan="3">Frete</td><td class="r">${money(g.frete)}</td></tr>` : ''}<tr><td colspan="3">Total do pedido</td><td class="r">${money(g.total)}</td></tr></tfoot></table></div>
    <div class="order-foot"><button class="btn soft sm" data-action="copy-order" data-sup="${g.s.id}">${icon('copy', 15)} Copiar pedido</button>
      <a class="btn wa sm" target="_blank" rel="noopener" href="${waLink(g.s.phone, g.msg)}">${icon('whatsapp', 16)} Enviar pedido no WhatsApp</a></div></section>`;
  }).join('<div style="height:16px"></div>')}
  <section class="card" style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><small>Total geral dos pedidos</small><div style="font:800 26px var(--display);letter-spacing:-.03em">${money(groups.reduce((t, g) => t + g.total, 0))}</div></div>
    ${q.status !== 'fechada' ? `<button class="btn primary" data-action="toggle-status">${icon('check', 16)} Marcar cotação como fechada</button>` : '<span class="chip">Cotação fechada</span>'}</section>`;
}

/* ---------- Envio: links assíncronos ---------- */
async function ensureLinks(q) {
  for (const sid of q.suppliers) {
    const s = getSup(sid); if (!s) continue;
    const payload = { v: 1, q: q.id, t: q.title, d: q.deadline || '', s: s.id, n: s.name, c: company(), w: buyerPhone(), i: q.items.map(i => [i.id, i.name, i.qty, i.unit, i.obs || '']) };
    const link = baseUrl() + '#/f/' + await pack(payload);
    ui.links[q.id + ':' + sid] = link;
    const href = waLink(s.phone, requestMessage(q, s, link));
    $$(`[data-wa-supplier="${sid}"]`).forEach(el => { el.href = href; el.removeAttribute('aria-disabled'); });
  }
}

async function sendAllLinks(q) {
  await ensureLinks(q);
  const selected = q.suppliers.map(getSup).filter(Boolean);
  const withPhone = selected.filter(s => s.phone);
  const withoutPhone = selected.filter(s => !s.phone);
  if (!withPhone.length) { toast('Nenhum fornecedor selecionado tem WhatsApp cadastrado.', 'err'); return; }
  const aviso = withoutPhone.length ? ` ${withoutPhone.length} ${withoutPhone.length === 1 ? 'fornecedor selecionado não tem' : 'fornecedores selecionados não têm'} WhatsApp cadastrado — envie o link manualmente pra ${withoutPhone.length === 1 ? 'ele' : 'eles'} (botão "Copiar link").` : '';
  const ok = await confirmBox(`Isso vai abrir ${withPhone.length} ${withPhone.length === 1 ? 'aba do WhatsApp' : 'abas do WhatsApp'}, uma pra cada fornecedor, já com a mensagem escrita. Você ainda precisa clicar em "Enviar" dentro de cada conversa.${aviso}`, 'Abrir todas');
  if (!ok) return;
  withPhone.forEach(s => {
    const link = ui.links[q.id + ':' + s.id];
    if (link) window.open(waLink(s.phone, requestMessage(q, s, link)), '_blank');
  });
  toast(`${withPhone.length} ${withPhone.length === 1 ? 'conversa aberta' : 'conversas abertas'} no WhatsApp.`);
}

/* ---------- Portal do fornecedor (link recebido) ---------- */
let portal = null;
async function renderPortal(code) {
  document.body.classList.add('portal-mode');
  document.title = 'Cotação — Cotaeasy';
  app.innerHTML = '<div class="portal"><div class="p-top"><span class="brand">' + logo(34) + 'Cotaeasy</span></div><p class="muted" style="padding:30px 0">Carregando cotação…</p></div>';
  let d;
  try {
    d = await unpack(code);
    if (!d || !Array.isArray(d.i)) throw new Error('bad');
  } catch (e) {

  portalRefresh();
}
function portalPrices() {
  const out = {};
  Object.entries(portal.draft.p).forEach(([k, v]) => { if (v > 0) out[k] = v; });
  return out;
}
function portalRefresh() {
  const { d, draft } = portal;
  let total = 0, count = 0;
  d.i.forEach(([id, , qty]) => {
    const p = draft.p[id], el = $(`[data-ptotal="${id}"]`), card = $(`[data-pitem="${id}"]`);
    if (p > 0) { total += p * qty; count++; }
    if (el) el.textContent = p > 0 ? money(p * qty) : '—';
    if (card) card.classList.toggle('done', p > 0);
  });
  const cEl = $('#p-count'), tEl = $('#p-total');
  if (cEl) cEl.textContent = count; if (tEl) tEl.textContent = money(total);
  try { localStorage.setItem(portal.key, JSON.stringify(draft)); } catch (e) { /* ignore */ }
}
async function finishResponse() {
  if (!portal) return;
  const { d, draft } = portal;
  const prices = portalPrices();
  if (!Object.keys(prices).length) { toast('Preencha ao menos um preço antes de concluir.', 'err'); return; }
  const payload = { v: 2, q: d.q, s: d.s, n: d.n, p: prices, f: parseNum(draft.f) || 0, z: draft.z, m: draft.m, t: draft.t, g: draft.g, o: draft.o };
  const code = await pack(payload);
  const link = baseUrl() + '#/r/' + code;
  const waText = `Olá! Aqui está minha resposta para a cotação "${d.t}" (${d.n}):\n${link}`;
  openModal('Resposta pronta!', `
    <p>Envie este link para quem pediu a cotação. Quando a pessoa clicar nele, sua resposta entra automaticamente no sistema dela — sem precisar digitar nada.</p>
    <label class="field" style="margin-top:14px"><span>Link da sua resposta</span><input class="in" id="resp-link" value="${esc(link)}" readonly onclick="this.select()"></label>
    <div class="modal-actions">
      <button type="button" class="btn soft" data-action="copy-resp-link">${icon('copy', 16)} Copiar link</button>
      <a class="btn wa" target="_blank" rel="noopener" href="${waLink(digits(d.w) || DEFAULT_WA, waText)}">${icon('whatsapp', 16)} Enviar pelo WhatsApp</a>
    </div>`, true);
}

/* ---------- Importar resposta do fornecedor ---------- */
async function importResponse(text) {
  const m = String(text).match(/COTAEASY:([A-Za-z0-9_-]+)/);
  if (!m) throw new Error('Não encontrei o código Cotaeasy. Cole a mensagem completa que o fornecedor enviou.');
  let data;
  try { data = await unpack(m[1]); } catch (e) { throw new Error('O código parece cortado. Peça para o fornecedor reenviar a resposta.'); }
  const q = data && getQuote(data.q);
  if (!q) throw new Error('Esta resposta é de uma cotação que não está neste navegador.');
  let sup = getSup(data.s) || state.suppliers.find(s => norm(s.name) === norm(data.n));
  if (!sup) { sup = { id: data.s || uid(), name: data.n || 'Fornecedor', contact: '', phone: '', email: '' }; state.suppliers.push(sup); }
  if (!q.suppliers.includes(sup.id)) q.suppliers.push(sup.id);
  const legacyPay = typeof data.g === 'string' ? data.g : '';
  const r = q.responses[sup.id] = { prices: {}, frete: Number(data.f) || 0, prazo: data.z || '', pgto: data.t || legacyPay, prazoPagamento: data.t || legacyPay, formasPagamento: Array.isArray(data.g) ? data.g : [], pedidoMinimo: data.m || '', obs: data.o || '', at: Date.now() };
  Object.entries(data.p || {}).forEach(([iid, v]) => { if (q.items.some(i => i.id === iid) && Number(v) > 0) r.prices[iid] = Number(v); });
  save();
  return { q, sup, n: Object.keys(r.prices).length };
}

/* ---------- Importar resposta a partir de um link (#/r/codigo) ---------- */
async function importFromLink(code) {
  document.body.classList.remove('portal-mode');
  let data;
  try {
    data = await unpack(code);
    if (!data || !data.q) throw new Error('bad');
  } catch (e) {
    mount(emptyState('Link inválido', 'Este link de resposta está incompleto. Peça ao fornecedor para reenviar o link completo.', `<a class="btn primary" href="#/">Voltar ao painel</a>`, 'info'), 'painel');
    document.title = 'Cotaeasy'; return;
  }
  const q = getQuote(data.q);
  if (!q) {
    mount(emptyState('Cotação não encontrada aqui', 'Esta resposta pertence a uma cotação que não existe neste navegador. Abra o link no mesmo computador/navegador em que a cotação foi criada.', `<a class="btn primary" href="#/">Voltar ao painel</a>`, 'info'), 'painel');
    document.title = 'Cotaeasy'; return;
  }
  let sup = getSup(data.s) || state.suppliers.find(s => norm(s.name) === norm(data.n));
  if (!sup) { sup = { id: data.s || uid(), name: data.n || 'Fornecedor', contact: '', phone: '', email: '' }; state.suppliers.push(sup); }
  if (!q.suppliers.includes(sup.id)) q.suppliers.push(sup.id);
  const r = q.responses[sup.id] = { prices: {}, frete: Number(data.f) || 0, prazo: data.z || '', pgto: data.t || '', prazoPagamento: data.t || '', formasPagamento: Array.isArray(data.g) ? data.g : [], pedidoMinimo: data.m || '', obs: data.o || '', at: Date.now() };
  Object.entries(data.p || {}).forEach(([iid, v]) => { if (q.items.some(i => i.id === iid) && Number(v) > 0) r.prices[iid] = Number(v); });
  save();
  toast(`Resposta de ${sup.name} importada — ${Object.keys(r.prices).length} preços`);
  go('cotacao/' + q.id + '/comparativo');
}

/* ---------- Roteador ---------- */
function route() {
  closeModal();
  applyTheme();
  const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
  const root = parts[0] || 'painel';
  if (root === 'f') { renderPortal(parts.slice(1).join('/')); return; }
  if (root === 'r') { importFromLink(parts.slice(1).join('/')); return; }
  portal = null;
  let html, active = 'painel', title = 'Painel';
  switch (root) {
    case 'cotacoes': html = viewQuotes(); active = 'cotacoes'; title = 'Cotações'; break;
    case 'cotacao': html = viewQuote(parts[1], parts[2]); active = 'cotacoes'; title = getQuote(parts[1])?.title || 'Cotação'; break;
    case 'fornecedores': html = viewSuppliers(); active = 'fornecedores'; title = 'Fornecedores'; break;
    case 'ajustes': html = viewSettings(); active = 'ajustes'; title = 'Ajustes'; break;
    default: html = viewDashboard();
  }
  document.title = `${title} — Cotaeasy`;
  mount(html, active);
  if (root === 'cotacao') {
    const q = getQuote(parts[1]);
    if ($('#compare')) updateCompare();
    if (q && $('[data-wa-supplier]')) ensureLinks(q);
  }
}
function render() { const y = window.scrollY; route(); window.scrollTo(0, y); }
function go(path) { const h = '#/' + path; if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); route(); });

/* ---------- Criação e edição ---------- */
function parseItems(text) {
  return String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    let name = line, qty = 1, unit = 'un', obs = '';
    if (/[;\t]/.test(line)) {
      const [n, q, u, o] = line.split(/[;\t]/).map(x => x.trim());
      name = n; qty = parseNum(q) || 1; unit = u || 'un'; obs = o || '';
    } else {
      const m = line.match(/^(\d+(?:[.,]\d+)?)\s*(?:(un|cx|kg|g|l|ml|pct|fd|dz|sc)\b)?\s*(?:x\s+|de\s+|-\s*)?(.+)$/i);
      if (m) { qty = parseNum(m[1]) || 1; const u = (m[2] || 'un'); unit = u.toLowerCase() === 'l' ? 'L' : u.toLowerCase(); name = m[3].trim(); }
    }
    return { id: uid(), name, qty, unit, obs };
  });
}

const currentQuote = () => getQuote($('[data-quote]')?.dataset.quote);

/* ---------- Eventos ---------- */
document.addEventListener('click', async e => {
  const bg = e.target.classList?.contains('modal-back') ? e.target : null;
  if (bg) { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el || el.matches('input[type=checkbox], input[type=search]')) return;
  const act = el.dataset.action;
  if (el.tagName === 'A' && act === 'new-quote') e.preventDefault();
  const q = currentQuote();

  switch (act) {
    case 'close-modal': closeModal(); break;
    case 'theme': state.settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); render(); break;
    case 'new-quote': openModal('Nova cotação', newQuoteForm()); break;
    case 'load-demo': loadDemo(); toast('Dados de exemplo carregados'); render(); break;
    case 'clear-demo':
      if (await confirmBox('Remover as cotações de exemplo?', 'Remover')) { state.quotes = state.quotes.filter(x => !x.demo); save(); toast('Exemplos removidos'); render(); }
      break;
    case 'import-response': openModal('Importar resposta', importForm()); break;
    case 'edit-quote': if (q) openModal('Editar cotação', `<form data-form="edit-quote"><label class="field"><span>Nome da cotação</span><input name="title" required value="${esc(q.title)}"></label><label class="field"><span>Responder até</span><input name="deadline" type="date" value="${esc(q.deadline || '')}"></label><div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form>`); break;
    case 'dup-quote':
      if (q) {
        const c = JSON.parse(JSON.stringify(q)); const map = {};
        c.id = uid(); c.demo = false; c.title = q.title + ' (cópia)'; c.createdAt = Date.now(); c.status = 'aberta'; c.responses = {}; c.overrides = {};
        c.items.forEach(i => { const n = uid(); map[i.id] = n; i.id = n; });
        state.quotes.unshift(c); save(); toast('Cotação duplicada'); go('cotacao/' + c.id + '/envio');
      } break;
    case 'toggle-status': if (q) { q.status = q.status === 'fechada' ? 'aberta' : 'fechada'; save(); toast(q.status === 'fechada' ? 'Cotação fechada' : 'Cotação reaberta'); render(); } break;
    case 'delete-quote':
      if (q && await confirmBox(`Excluir a cotação “${q.title}”? Isso apaga os preços recebidos.`, 'Excluir')) { state.quotes = state.quotes.filter(x => x.id !== q.id); save(); toast('Cotação excluída'); go('cotacoes'); }
      break;
    case 'add-item':
      if (q) { q.items.push({ id: uid(), name: '', qty: 1, unit: 'un', obs: '' }); save(); render(); const n = $$('.item-row .name').pop(); if (n) n.focus(); }
      break;
    case 'del-item': if (q) { q.items = q.items.filter(i => i.id !== el.dataset.item); save(); render(); } break;
    case 'paste-items': openModal('Colar lista de itens', `<form data-form="paste-items"><label class="field"><span>Um item por linha</span><textarea name="items" required placeholder="12 un Whisky Red Label 1L&#10;6 cx Energético 250ml"></textarea><small>Também aceita colunas do Excel: nome, quantidade, unidade e observação.</small></label><div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Adicionar itens</button></div></form>`); break;
    case 'copy-link': { const l = q && ui.links[q.id + ':' + el.dataset.sup]; l ? copyText(requestMessage(q, getSup(el.dataset.sup), l)) : toast('Gerando o link… tente de novo em instantes.', 'err'); break; }
    case 'copy-list': if (q) copyText(listMessage(q)); break;
    case 'send-all': if (q) await sendAllLinks(q); break;
    case 'copy-order': if (q) copyText(orderFor(q, el.dataset.sup).msg); break;
    case 'pin':
      if (q) {
        const { item, sup } = el.dataset;
        if (q.responses[sup]?.prices?.[item]) { q.overrides[item] === sup ? delete q.overrides[item] : (q.overrides[item] = sup); save(); updateCompare(); }
      } break;
    case 'export-csv': if (q) exportCsv(q); break;
    case 'print': window.print(); break;
    case 'finish-response': await finishResponse(); break;
    case 'copy-resp-link': { const el = document.getElementById('resp-link'); if (el) copyText(el.value); break; }
    case 'add-supplier': openModal('Novo fornecedor', supplierForm()); break;
    case 'edit-supplier': openModal('Editar fornecedor', supplierForm(getSup(el.dataset.sup))); break;
    case 'delete-supplier': {
      const s = getSup(el.dataset.sup);
      if (s && await confirmBox(`Excluir ${s.name}? Os preços dele saem das cotações.`, 'Excluir')) {
        state.suppliers = state.suppliers.filter(x => x.id !== s.id);
        state.quotes.forEach(x => { x.suppliers = x.suppliers.filter(i => i !== s.id); delete x.responses[s.id]; Object.keys(x.overrides).forEach(k => { if (x.overrides[k] === s.id) delete x.overrides[k]; }); });
        save(); toast('Fornecedor excluído'); render();
      } break;
    }
    case 'export-backup': download(`cotaeasy-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(state, null, 2), 'application/json'); break;
    case 'import-backup': $('#backup-file').click(); break;
    case 'reset-all':
      if (await confirmBox('Apagar todas as cotações, fornecedores e ajustes deste navegador?', 'Apagar tudo')) { state = defaultState(); save(); toast('Dados apagados'); go(''); }
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  const q = currentQuote();
  if (t.matches('[data-action="toggle-sup"]') && q) {
    const id = t.dataset.sup;
    q.suppliers = t.checked ? [...new Set([...q.suppliers, id])] : q.suppliers.filter(x => x !== id);
    save(); render(); return;
  }
  if (t.matches('[data-action="toggle-frete"]') && q) { q.useFrete = t.checked; save(); updateCompare(); return; }
  if (t.matches('[data-price]') && q) {
    const r = getResp(q, t.dataset.sup), v = parseNum(t.value);
    if (v != null && v > 0) r.prices[t.dataset.item] = v; else delete r.prices[t.dataset.item];
    r.at = Date.now(); t.value = numFmt(r.prices[t.dataset.item]); save(); updateCompare(); return;
  }
  if (t.matches('[data-meta]') && q) {
    const r = getResp(q, t.dataset.sup), k = t.dataset.meta;
    if (k === 'frete') { r.frete = parseNum(t.value) || 0; t.value = numFmt(r.frete || ''); }
    else if (k === 'formasPagamento') { r.formasPagamento = t.value.split(',').map(x => x.trim()).filter(Boolean); t.value = r.formasPagamento.join(', '); }
    else r[k] = t.value.trim();
    save(); updateCompare(); return;
  }
  if (t.matches('[data-field]') && q) {
    const it = q.items.find(i => i.id === t.closest('[data-item]').dataset.item); if (!it) return;
    const f = t.dataset.field;
    if (f === 'qty') { it.qty = parseNum(t.value) || 1; t.value = qtyFmt(it.qty); } else it[f] = t.value.trim();
    save(); return;
  }
  if (t.matches('[data-setting]')) {
    const k = t.dataset.setting; state.settings[k] = k === 'whatsapp' ? digits(t.value) || DEFAULT_WA : t.value.trim();
    if (k === 'whatsapp') t.value = state.settings.whatsapp;
    save(); applyTheme(); toast('Ajuste salvo'); return;
  }
  if (t.id === 'backup-file' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { try { const s = JSON.parse(rd.result); if (!s.quotes || !s.suppliers) throw 0; state = migrate(s); save(); toast('Backup restaurado'); go(''); } catch (err) { toast('Arquivo de backup inválido.', 'err'); } };
    rd.readAsText(t.files[0]); t.value = '';
  }
  if (t.matches('[data-pf]') && portal) { /* tratado no input */ }
  if (t.matches('[data-pgm]') && portal) {
    const m = t.dataset.pgm, g = portal.draft.g;
    if (t.checked) { if (!g.includes(m)) g.push(m); } else { portal.draft.g = g.filter(x => x !== m); }
    portalRefresh();
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (portal) {
    if (t.matches('[data-pp]')) { const v = parseNum(t.value); if (v > 0) portal.draft.p[t.dataset.pp] = v; else delete portal.draft.p[t.dataset.pp]; portalRefresh(); }
    else if (t.matches('[data-pf]')) { portal.draft[t.dataset.pf] = t.value; portalRefresh(); }
  }
  if (t.matches('[data-action="search-quotes"]')) {
    const v = norm(t.value);
    $$('#quote-list .q-row').forEach(r => { r.hidden = v && !r.dataset.search.includes(v); });
  }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (portal && t.matches('[data-pp]')) { const v = portal.draft.p[t.dataset.pp]; t.value = v ? numFmt(v) : t.value && parseNum(t.value) ? numFmt(parseNum(t.value)) : ''; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('.modal-back')) { closeModal(); return; }
  const t = e.target;
  if (e.key === 'Enter' && t.matches('[data-price]')) {                 // Enter desce para o próximo item
    e.preventDefault();
    const col = $$(`[data-price][data-sup="${t.dataset.sup}"]`), i = col.indexOf(t);
    (col[i + 1] || t).focus(); (col[i + 1] || t).select && (col[i + 1] || t).select();
  }
  if (e.key === 'Enter' && t.matches('.item-row .name')) {              // Enter em um item cria o próximo
    e.preventDefault(); t.dispatchEvent(new Event('change', { bubbles: true }));
    const q = currentQuote(); if (q) { q.items.push({ id: uid(), name: '', qty: 1, unit: 'un', obs: '' }); save(); render(); const n = $$('.item-row .name').pop(); if (n) n.focus(); }
  }
});

document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  const q = currentQuote();
  switch (f.dataset.form) {
    case 'new-quote': {
      const nq = { id: uid(), title: d.title.trim(), createdAt: Date.now(), deadline: d.deadline || '', status: 'aberta', items: parseItems(d.items), suppliers: state.suppliers.map(s => s.id), responses: {}, overrides: {}, useFrete: true };
      state.quotes.unshift(nq); save(); toast('Cotação criada'); go('cotacao/' + nq.id + (nq.items.length ? '/envio' : '/itens')); break;
    }
    case 'edit-quote': if (q) { q.title = d.title.trim() || q.title; q.deadline = d.deadline || ''; save(); toast('Cotação atualizada'); render(); } break;
    case 'paste-items': if (q) { q.items.push(...parseItems(d.items)); save(); toast('Itens adicionados'); render(); } break;
    case 'supplier': {
      const s = d.id ? getSup(d.id) : null;
      if (s) Object.assign(s, { name: d.name.trim(), contact: d.contact.trim(), phone: d.phone.trim(), email: d.email.trim() });
      else state.suppliers.push({ id: uid(), name: d.name.trim(), contact: d.contact.trim(), phone: d.phone.trim(), email: d.email.trim() });
      save(); toast('Fornecedor salvo'); render(); break;
    }
    case 'import-response':
      try {
        const r = await importResponse(d.text);
        toast(`${r.n} ${r.n === 1 ? 'preço importado' : 'preços importados'} de ${r.sup.name}`);
        closeModal(); go('cotacao/' + r.q.id + '/comparativo');
      } catch (err) { toast(err.message, 'err'); }
      break;
  }
});

/* ---------- Exportar planilha (CSV para Excel) ---------- */
function exportCsv(q) {
  const a = analyze(q);
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Item', 'Qtd', 'Un', ...a.sups.map(s => s.name), 'Melhor preço', 'Fornecedor vencedor', 'Total do item']];
  a.items.forEach(r => rows.push([
    r.item.name, numFmt(r.item.qty), r.item.unit,
    ...a.sups.map(s => numFmt(r.offers.find(o => o.sid === s.id)?.price)),
    numFmt(r.winnerPrice), r.winner ? getSup(r.winner).name : '', numFmt(r.winner ? r.total : null)
  ]));
  rows.push([], ['Total combinado', '', '', ...a.sups.map(() => ''), '', '', numFmt(a.split)]);
  download(`cotacao-${q.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40)}.csv`, '\ufeff' + rows.map(r => r.map(cell).join(';')).join('\r\n'), 'text/csv');
}

/* ---------- Início ---------- */
applyTheme();
route();
})();

  </script>
